name: Automated Test Execution

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [Chrome]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore SauceDemo.AutomationFramework.sln

    - name: Build solution
      run: dotnet build SauceDemo.AutomationFramework.sln --configuration Release --no-restore

    - name: Run tests
      env:
        TEST_ENVIRONMENT: CI
        BROWSER: ${{ matrix.browser }}
        HEADLESS: true
      run: dotnet test SauceDemo.AutomationFramework.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.browser }}
        path: |
          **/TestResults/*.trx
          **/logs/*.log
          **/Screenshots/*.png

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results - ${{ matrix.browser }}
        path: '**/TestResults/*.trx'
        reporter: dotnet-trx
        fail-on-error: false
